name: Publish TmlUs CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish package
        uses: Time-Machine-Lab/TML-Github_Actions/actions/publish-node-package@main
        with:
          cache_dependency_path: tmlus-core/package-lock.json
          node_version: '20.x'
          working_directory: tmlus-core
          build_command: npm run build
          publish_command: npm publish --access public
          tag_prefix: v
          registry_url: ${{ secrets.NPM_REGISTRY_URL }}
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Pack GitHub release artifact
        shell: bash
        working-directory: tmlus-core
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tmlus-release"
          npm pack --pack-destination "$RUNNER_TEMP/tmlus-release"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/tmlus-release/*.tgz --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/tmlus-release/*.tgz --title "$tag" --generate-notes --verify-tag
          fi
